[project]
name = "discord-grok-bridge"
version = "0.1.0"
description = "Private, durable Discord to Grok Bot bridge with a local reply helper"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["discord.py==2.7.1", "aiohttp==3.14.5"]

[project.scripts]
bridge = "discord_grok_bridge.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.17.0"]

[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
